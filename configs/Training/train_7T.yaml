run:
  name: "7T"
  seed: 42
  gpu: 1

data:
  base_dir: "../../data/7T/B0corrected_wo_LipidMask"

  train_subjects: ['Brisbane/Vol3', 'Brisbane/Vol4', 'Brisbane/Vol5', 'Brisbane/Vol6', 'London/Vol2', 'London/Vol3', 'London/Vol4', 'London/Vol5', 'Vienna/Vol6', 'Vienna/Vol7', 'Vienna/Vol8', 'Vienna/Vol9']
  val_subjects: ['Vienna/Vol5', 'Brisbane/Vol1', 'London/Vol1']

  simulation_config: "../Simulation/7T_on_the_fly.yaml"

  resources:
    version: "water_lipid_v1"
    filename: "TrainData/SimulationResources_{version}.h5"
    
ooutput:
  base_dir: "../../models"
  overwrite: false

training:
  batch_size: 950
  epochs: 500

  # Number of newly simulated training batches per epoch.
  n_batches: 600

  # Print information for every individual batch.
  verbose: false

validation:
  # A fixed synthetic validation dataset is generated once at startup
  # and reused after every epoch.
  seed: 12345
  n_spectra: 35000
  batch_size: 3300

optim:
  lr: 0.0002

scheduler:
  milestones: [50, 100, 150, 200]
  gamma: 0.5

model:
  architecture: "unet"  # "unet" or "ynet"
  n_layers: 6
  n_filters: 32
  in_channels: 2
  out_channels: 2
  dropout: 0.0

checkpoint:
  # Loads only model weights from:
  # ../../models/<preload_model>/model_last.pt
  preload: false
  preload_model: ""