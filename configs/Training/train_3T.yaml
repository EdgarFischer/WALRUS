    - "PRISMAFIT_Vienna/Vol04_LP/Res50x50"
    - "PRISMAFIT_Vienna/Vol04_LP/Res64x64x41"

    # PRISMA_Vienna
    - "PRISMA_Vienna/Vol05_LH/Res36x36"
    - "PRISMA_Vienna/Vol05_LH/Res50x50"
    - "PRISMA_Vienna/Vol05_LH/Res64x64x41"
    - "PRISMA_Vienna/Vol05_LH/Res64x64x47"

    # VIDA_Vienna
