version: "simulation_v5"


acquisition:
  bandwidth_hz: 2778.0

  # Internal maximum simulation length.
  n_timepoints: 840

  # Range of simulated native acquisition lengths.
  min_acquired_n_timepoints: 840
  max_acquired_n_timepoints: 840

  # true:
  #   Sample one acquisition length per spectrum and zero-fill
  #   every spectrum to n_timepoints.
  #
  # false:
  #   Sample one acquisition length for the complete batch and
  #   return the batch at this native length without zero-filling.
  zero_filling: false

  # Larmor frequency of the acquisition.
  #
  # Used by the configuration builder to convert ppm-based
  # frequency parameters into the simulator's internal unit Hz.
  #
  # hz_per_ppm = nmr_frequency_hz / 1e6
  nmr_frequency_hz: 297222931


basis:
  library: "../../MetabModes/LCModelBasis/processed/7T_basis_tumor_v1.h5"


metabolites:
  profiles:
    - config: "Metabos_healthy_7T_WALINET_Style.yaml" #"Metabos_healthy_7T_2sigma.yaml"
      probability: 1
    
    #- config: "Metabos_tumor_7T_2sigma.yaml"
    #  probability: 0.3

  # Global frequency shift in ppm.
  #
  # Uniform WALINET-style range, internally converted from ppm to Hz.
  frequency_shift:
    distribution:
      type: "uniform"
      minimum_ppm: -0.5
      maximum_ppm: 0.5

  # Spectral FWHM in ppm.
  #
  # Uniform WALINET-style total Voigt FWHM. The sampled value is converted
  # from ppm to Hz before the existing Voigt FWHM split is applied.
  fwhm:
    distribution:
      type: "uniform"
      minimum_ppm: 0.0135
      maximum_ppm: 0.168

  # Frequency-independent global phase rotation.
  #
  # Uniform WALINET-style phase over one complete rotation in radians.
  zero_order_phase:
    distribution:
      type: "uniform"
      minimum_rad: 0.0
      maximum_rad: 6.283185307179586

  # Linear phase slope over frequency.
  #
  # Model:
  #
  #   0.50 * Normal(center, normal_std)
  # + 0.25 * (center + LogNormal(tail_log_mu, tail_log_sigma))
  # + 0.25 * (center - LogNormal(tail_log_mu, tail_log_sigma))
  #
  # The lognormal tail is calibrated from:
  #
  #   abs(first_order_phase - center)
  #
  # Internally converted from deg/ppm to rad/Hz.
  first_order_phase:
    distribution:
      type: "symmetric_mixture"

      center_deg_per_ppm: 1.0

      normal:
        std_deg_per_ppm: 26.7

      lognormal_tail:
        log_mu: 2.2
        log_sigma: 2.34


noise:
  # LCModel-compatible target S/N:
  #
  #   S/N = maximum metabolite peak
  #         / (2 * RMS(receiver noise))
  #
  # Model:
  #
  #   0.50 * truncated Normal
  # + 0.50 * LogNormal
  #
  # Values below min are rejected and resampled.
  snr:
    distribution:
      type: "positive_mixture"

      normal:
        mean: 9
        std: 5.19

      lognormal:
        log_mu: 2.2
        log_sigma: 0.5732

      min: 1.0


water:
  # Published WALINET-style water amplitude relative to the maximum
  # metabolite amplitude: log-uniform from 0.01 to 100.
  scaling:
    distribution:
      type: "log_uniform"
      minimum: 0.01
      maximum: 100.0


lipids:
  n_random_fids: 10

  # Published WALINET training-style lipid amplitude relative to the maximum
  # metabolite amplitude: log-uniform from 0.1 to 500.
  scaling:
    distribution:
      type: "log_uniform"
      minimum: 0.1
      maximum: 1000.0


subject_sampling:
  mixing: "same_subject"


lipid_projection:
  enabled: true
