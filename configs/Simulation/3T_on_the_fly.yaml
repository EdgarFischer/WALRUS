version: "simulation_v5"


acquisition:
  bandwidth_hz: 939.85

  # Fixed internal and output length after zero-filling.
  n_timepoints: 288

  # Actually acquired FID samples before zero-filling.
  min_acquired_n_timepoints: 288
  max_acquired_n_timepoints: 288

  # true:
  #   Sample one acquisition length per spectrum and zero-fill
  #   every spectrum to n_timepoints.
  #
  # false:
  #   Sample one acquisition length for the complete batch and
  #   return the batch at this native length without zero-filling.
  zero_filling: false

  # Larmor frequency of the acquisition.
  #
  # Used by the configuration builder to convert ppm-based
  # frequency parameters into the simulator's internal unit Hz.
  #
  # hz_per_ppm = nmr_frequency_hz / 1e6
  nmr_frequency_hz: 123231706.0


basis:
  library: "../../MetabModes/LCModelBasis/processed/3T_basis_healthy_v1.h5"


metabolites:
  profiles:
    - config: "Metabos_healthy_3T_2sigma.yaml"
      probability: 1
  

  # Global frequency shift in ppm.
  #
  # Model:
  #
  #   0.50 * Normal(center, normal_std)
  # + 0.25 * (center + LogNormal(tail_log_mu, tail_log_sigma))
  # + 0.25 * (center - LogNormal(tail_log_mu, tail_log_sigma))
  #
  # The lognormal tail is calibrated from:
  #
  #   abs(frequency_shift - center)
  #
  # Internally converted from ppm to Hz.
  frequency_shift:
    distribution:
      type: "symmetric_mixture"

      center_ppm: 0.0

      normal:
        std_ppm: 0.216

      lognormal_tail:
        log_mu: -2.54
        log_sigma: 1.77

  # Spectral FWHM in ppm.
  #
  # Model:
  #
  #   0.50 * zero-truncated Normal
  # + 0.50 * LogNormal
  #
  # The normal component is rejected and resampled when FWHM <= 0.
  # The sampled FWHM is subsequently converted from ppm to Hz.
  fwhm:
    distribution:
      type: "positive_mixture"

      normal:
        mean_ppm: 0.079 
        std_ppm: 0.039 #2 sigma originally: 0.0786

      lognormal:
        log_mu: -2.54
        log_sigma: 0.515 # 2 sigma oringally: 1.03

      minimum_ppm: 0.0

  # Frequency-independent global phase rotation.
  #
  # Model:
  #
  #   0.50 * Normal(center, normal_std)
  # + 0.25 * (center + LogNormal(tail_log_mu, tail_log_sigma))
  # + 0.25 * (center - LogNormal(tail_log_mu, tail_log_sigma))
  #
  # The lognormal tail is calibrated from:
  #
  #   abs(zero_order_phase - center)
  #
  # Internally converted from degrees to radians.
  zero_order_phase:
    distribution:
      type: "symmetric_mixture"

      center_deg: 28.0

      normal:
        std_deg: 91.9

      lognormal_tail:
        log_mu: 3.43
        log_sigma: 2.06

  # Linear phase slope over frequency.
  #
  # Model:
  #
  #   0.50 * Normal(center, normal_std)
  # + 0.25 * (center + LogNormal(tail_log_mu, tail_log_sigma))
  # + 0.25 * (center - LogNormal(tail_log_mu, tail_log_sigma))
  #
  # The lognormal tail is calibrated from:
  #
  #   abs(first_order_phase - center)
  #
  # Internally converted from deg/ppm to rad/Hz.
  first_order_phase:
    distribution:
      type: "symmetric_mixture"

      center_deg_per_ppm: 3.4

      normal:
        std_deg_per_ppm: 40.2

      lognormal_tail:
        log_mu: 2.61
        log_sigma: 2.29


noise:
  # LCModel-compatible target S/N:
  #
  #   S/N = maximum metabolite peak
  #         / (2 * RMS(receiver noise))
  #
  # Model:
  #
  #   0.50 * truncated Normal
  # + 0.50 * LogNormal
  #
  # Values below min are rejected and resampled.
  snr:
    distribution:
      type: "positive_mixture"

      normal:
        mean: 3
        std: 4.45

      lognormal:
        log_mu: 1.1
        log_sigma: 1.36

      min: 1.0


water:
  # Water amplitude relative to the maximum metabolite amplitude.
  #
  # Model:
  #
  #   0.50 * zero-truncated Normal
  # + 0.50 * LogNormal
  scaling:
    distribution:
      type: "positive_mixture"

      normal:
        mean: 22.1
        std: 26.1

      lognormal:
        log_mu: 3.1
        log_sigma: 1.23

      minimum: 0.0


lipids:
  n_random_fids: 10

  # Lipid amplitude relative to the maximum metabolite amplitude.
  #
  # Model:
  #
  #   0.50 * zero-truncated Normal
  # + 0.50 * LogNormal
  scaling:
    distribution:
      type: "positive_mixture"

      normal:
        mean: 2.99
        std: 6.37

      lognormal:
        log_mu: 1.1
        log_sigma: 1.82

      minimum: 0.0


subject_sampling:
  mixing: "same_subject"


lipid_projection:
  enabled: false